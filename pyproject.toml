[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uvr_loan"
version = "0.1.0"
description = "Investment strategy to fund a UVR-denominated loan."
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyyaml", "scipy", "truststore", "yfinance"]

[project.scripts]
uvr-amortization = "uvr_loan.amortization:main"
uvr-download = "uvr_loan.data.sources:main"
uvr-panel = "uvr_loan.data.cleaning:main"
uvr-portfolio = "uvr_loan.portfolio:main"
uvr-backtest = "uvr_loan.backtest:main"
uvr-stress = "uvr_loan.stress:main"

[dependency-groups]
dev = ["ruff", "pytest", "pytest-cov", "matplotlib", "ipykernel", "nbconvert"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = ["network: downloads real data (needs internet)"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
