# Problem parameters and modeling assumptions (S1–S8).

initial_capital_cop: 760_000_000

loan:
  principal_uvr: 1_000_000
  term_months: 120
  annual_rate: 0.10            # UVR + 10% effective annual
  grace_months: 36             # S1: full grace, interest is capitalized
  prepayments_uvr:             # S5: agreed upfront, term and payment stay fixed
    48: 50_000                 # S7: end of year 4
    60: 50_000                 # S7: end of year 5

backtest:
  t0: 2016-10                  # S4: historical start date
  horizon_months: 120
  rebalance_every: 6           # S8: dynamic strategy re-estimation frequency (months)
  rebalance_sensitivity: [3, 6, 12]

inflation_scenarios:
  base_lookback_months: 6      # base = annualized UVR inflation of the last 6 months (placeholder model)
  high_shock_pp: 3.0           # high = base + 3 pp
  low_shock_pp: -1.5           # low = base - 1.5 pp

rules:
  zero_shortfall: true         # S2: cash must cover every payment
  min_funding_ratio: 1.10      # cut risk below this level
  taxes: false                 # S3
  transaction_costs: false     # S6

conservative:                  # Plan 1: FIC (liquidity) + CDT (rest) + small ETF share
  equity_weight: 0.10          # share of the non-liquidity wealth held in the ETF
  liquidity_scenario: high     # inflation scenario used to size the FIC

data:
  start: "2016-01-01"           # first day of the FIC data (Superfinanciera)
  end: "2026-11-30"
  etf_ticker: ICOLCAP.CL       # Yahoo Finance, iShares COLCAP (COP)
  uvr_series: 850              # BanRep SUAMECA series ID, daily COP per UVR
  rate_series:                 # SUAMECA IDs, weekly, % effective annual
    cdt_90: 65                 # DTF = 90-day CDT rate
    cdt_180: 67
    cdt_360: 68
  fic_funds:                   # FIC returns: index of real money market funds (S10)
    dataset: qhpu-8ixx         # Superfinanciera on datos.gov.co, daily unit values
    subtype: FIC DE MERCADO MONETARIO
    max_daily_change: 0.05     # fund-days with a larger change (or a unit value <= 0) are logged and excluded

cdt_ladder:                    # Plan 2: ladder of fixed-rate CDTs chosen with an LP in UVR
  liquidity_scenario: base     # inflation that turns nominal rates (CDT and FIC) into expected real ones
  terms:                       # CDT term in months: panel column with its rate
    3: cdt_90
    6: cdt_180
    12: cdt_360
