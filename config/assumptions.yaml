# Problem parameters and modeling assumptions (S1–S19, see docs/plan_proyecto_credito_uvr.md).
# Naming: money ends in _cop or _uvr; rates are decimals ending in _ea (effective annual) or _m (monthly).

initial_capital_cop: 760_000_000

loan:
  principal_uvr: 1_000_000
  term_months: 120
  annual_rate: 0.10            # UVR + 10% effective annual
  grace_months: 36             # S1: full grace, interest is capitalized
  prepayments_uvr:             # S5: agreed upfront, term and payment stay fixed; keys are months
    48: 50_000                 # S7: end of year 4
    60: 50_000                 # S7: end of year 5

backtest:
  t0: 2016-10                  # S4: historical start date (month 0)
  horizon_months: 120
  review_every_months: 6       # S8: k, months between reviews of the portfolio
  review_sensitivity_months: [3, 6, 12]

inflation_scenarios:
  source: forecast             # trailing: base = trailing UVR inflation, high/low = base + shock; forecast: the three come from the forecast file
  base_lookback_months: 6      # S14, trailing source only: base = annualized UVR inflation of the last 6 months (provisional)
  high_shock_pp: 3.0           # trailing source only: high = base + 3 pp
  low_shock_pp: -1.5           # trailing source only: low = base - 1.5 pp
  forecast_file: data/forecasts/hw_inflation_forecasts.csv   # one row per decision month, made with information up to its close
  forecast_columns:            # forecast source only: column of the forecast file that is each scenario
    low: p05_ea                # 5th percentile of the 6-month inflation forecast
    base: median_ea
    high: p995_ea              # 99.5th percentile

conservative:                  # Plan 1: FIC (liquidity + a share of the rest) + CDT; no ETF
  cdt_weight: 0.90             # share of the money left after the liquidity that goes to the CDT (the rest stays in the FIC)
  grace_cdt_weight: 1.0        # cdt_weight at the reviews of the grace period (no payments yet)
  fic_sizing_scenario: base    # inflation scenario used to size the FIC

data:
  start: "2016-01-01"          # first day of the FIC data (Superfinanciera)
  end: "2026-11-30"
  etf_history_start: "2013-01-01"  # ETFs are downloaded from here: their volatility needs years before t0
  vol_window_months: 36        # months of returns behind <name>_vol_ea (only months up to each one)
  etfs:                        # Yahoo Finance, adjusted close; panel column <name>_price_cop (USD converted with the TRM)
    icolcap: {ticker: ICOLCAP.CL, currency: COP}   # iShares MSCI COLCAP (BVC)
    cspx: {ticker: CSPX.L, currency: USD}          # iShares Core S&P 500 UCITS, Irish, accumulating (LSE, USD line)
  trm_series: 1                # BanRep SUAMECA series ID, daily COP per USD (TRM)
  uvr_series: 850              # BanRep SUAMECA series ID, daily COP per UVR
  cdt_series:                  # panel column: SUAMECA ID (weekly, % effective annual; the panel keeps decimals)
    cdt_90d_ea: 65             # DTF series = 90-day CDT rate
    cdt_180d_ea: 67
    cdt_360d_ea: 68
  fic_source:                  # FIC returns: index of real money market funds (S10)
    dataset: qhpu-8ixx         # Superfinanciera on datos.gov.co, daily unit values
    subtype: FIC DE MERCADO MONETARIO
    max_daily_change: 0.05     # fund-days with a larger change (or a unit value <= 0) are logged and excluded

cdt_ladder:                    # Plan 2: ladder of fixed-rate CDTs chosen with an LP in UVR
  deflator_scenario: base      # inflation that turns nominal rates (CDT and FIC) into expected real ones
  term_columns:                # CDT term in months: panel column with its rate
    3: cdt_90d_ea
    6: cdt_180d_ea
    12: cdt_360d_ea

ldi:                           # Plan 3: CDT ladder up to the floor (x 1.05), ETFs with the rest (CPPI with m = 1)
  floor_scenario: base         # inflation of the floor and of the ladder bought with it
  floor_buffer: 0.05           # the ladder gets (1 + buffer) x floor; the rest of the free money goes to the ETFs
  growth_assets: [icolcap, cspx]   # names in data.etfs; split by inverse volatility (data.vol_window_months)

ratchet_ldi:                   # Plan 4: plan 3 with a ratchet (TIPP) on the real surplus S = assets - liabilities, in UVR (same floor, ladder and ETFs: ldi.*)
  protected_share: 0.80        # phi: share of the highest surplus of the run that is protected, Z = liabilities + phi * peak S
  max_fall: 0.25               # delta: ETF fall between two reviews that takes the assets down to Z at most: ETFs = (assets - Z) / delta, capped at plan 3's ETFs.
                               # Worst 6-month falls in COP since 2013: ICOLCAP -30.5 % (to 2020-05), CSPX -17.4 % (to 2022-06)

inflation_model:               # Hull-White forecast of the 6-month inflation (uvr_loan.inflation_model); writes inflation_scenarios.forecast_file
  betas_file: data/raw/betas_historicos.csv   # Nelson-Siegel betas of the Banco de la República, downloaded by hand (data/SOURCES.md)
  betas_start: "2010-01-01"    # betas before this date are ignored
  tenors: 36                   # annual nodes (1 .. tenors) of the COP and UVR curves
  vol_window_days: 365         # observations (calendar days) of the rolling std of each node's level
  vol_percentile: 0.995        # sigma of each node = this percentile of its rolling std
  kappas: [0.11, 0.13]         # mean reversion before and after kappa_switch_years
  kappa_switch_years: 5        # also the number of sigma nodes used (see the quirks in inflation_model/hull_white.py)
  n_paths: 10000               # simulated paths per origin; the p99.5 needs a well resolved tail
  seed: 123456
  horizon_months: 6            # inflation forecast: the sample tenor, the realized lag (+ UVR lag) and the seasonal window derive from it
  min_history: 12              # realized errors needed before an origin can be forecast
  first_origin: "2013-06"      # first month with enough betas for the rolling window and the error history
  first_forecast: "2016-01"    # first month written to the forecast file

synthetic_etfs:                # Made-up ETF paths from t0 (python -m uvr_loan.synthetic); rates, UVR, FIC and payments stay historical
  seed: 42                     # the same seed gives the same paths; path j has the same draws in every scenario, each ETF its own
  n_paths: 2000                # random paths per scenario (plans 3 and 4 run on each; plan 2 holds no ETF and runs once)
  sigma_ea: 0.15               # default annual volatility of the Brownian noise; a scenario can override it per ETF
  scenarios:                   # per ETF: drift_ea (annual log drift), and optionally sigma_ea, amplitude + period_months (sine), crash_month + crash_fall
    both_down:
      icolcap: {drift_ea: -0.15}
      cspx: {drift_ea: -0.15}
    flat_volatile:
      icolcap: {drift_ea: 0.0, sigma_ea: 0.40}
      cspx: {drift_ea: 0.0, sigma_ea: 0.40}
    diverge:
      icolcap: {drift_ea: 0.15}
      cspx: {drift_ea: -0.15}
    crash:                     # 40 % fall in month 37 (the month after the review of month 36), then the same drift
      icolcap: {drift_ea: 0.10, crash_month: 37, crash_fall: 0.40}
      cspx: {drift_ea: 0.10, crash_month: 37, crash_fall: 0.40}
    sine:                      # log price +- 0.25 around the start, one cycle every 4 years
      icolcap: {drift_ea: 0.0, sigma_ea: 0.10, amplitude: 0.25, period_months: 48}
      cspx: {drift_ea: 0.0, sigma_ea: 0.10, amplitude: 0.25, period_months: 48}
    steady_up:                 # the ETFs beat the CDTs on average (positive premium)
      icolcap: {drift_ea: 0.10, sigma_ea: 0.18}
      cspx: {drift_ea: 0.10, sigma_ea: 0.18}
    steady_up_noisy:
      icolcap: {drift_ea: 0.08, sigma_ea: 0.25}
      cspx: {drift_ea: 0.08, sigma_ea: 0.25}
    dip_then_up:               # 20 % fall in month 37, then the same rising drift
      icolcap: {drift_ea: 0.10, crash_month: 37, crash_fall: 0.20}
      cspx: {drift_ea: 0.10, crash_month: 37, crash_fall: 0.20}
